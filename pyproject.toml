[project]
name = "erpnextswiss"
authors = [
    { name = "libracore AG", email = "info@libracore.com"}
]
description = "ERPNext extension for Switzerland"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # dependencies
    # NOTE: "frappe" retiré des dépendances pip : fourni par le bench, et sa résolution
    # (pypika en dépendance-URL) casse `uv pip install`. Fix de compatibilité (Frappe v16).
    "bs4",
    "factur-x>=2.3",
    "qrbill>=1.2",
    "unidecode",
    "opencv-python",
    "pymupdf",
    "fintech",
    "pysftp",
    "icalendar",
    "lxml",
    "paramiko<4",
]

[project.urls]
Homepage = "https://git.libracore.io/libracore/erpnextswiss"
Repository = "https://git.libracore.io/libracore/erpnextswiss.git"
"Bug Reports" = "https://git.libracore.io/libracore/erpnextswiss/issues"

[deploy.dependencies.apt]
packages = [
    "ffmpeg",
    "libsm6",
    "libxext6",
]